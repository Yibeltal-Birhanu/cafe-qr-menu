<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0a07" />
  <meta name="description" content="Explore our authentic Habesha specialties, flame-grilled burgers, stone-baked pizzas, specialty coffee, and handcrafted desserts." />
  <title>Cafe &mdash; Digital QR Menu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e6923c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 8h1a4 4 0 0 1 0 8h-1'/><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'/><line x1='6' y1='2' x2='6' y2='4'/><line x1='10' y1='2' x2='10' y2='4'/><line x1='14' y1='2' x2='14' y2='4'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/menu-showcase.css" />
</head>
<body>
  <div id="root">
    <div class="cm-preloader" id="staticPreloader" role="status" aria-live="polite">
      <div class="cm-preloader__ambient-glow">
        <div class="cm-preloader__glow-circle cm-preloader__glow-circle--1" style="background: #e6923c;"></div>
        <div class="cm-preloader__glow-circle cm-preloader__glow-circle--2" style="background: #f59e0b;"></div>
      </div>
      <div class="cm-preloader__card">
        <div class="cm-preloader__emblem-stage">
          <div class="cm-preloader__pulse-ring cm-preloader__pulse-ring--outer" style="border-color: #e6923c;"></div>
          <div class="cm-preloader__pulse-ring cm-preloader__pulse-ring--inner" style="border-color: #e6923c;"></div>
          <div class="cm-preloader__icon-box" style="color: #e6923c;">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="2" x2="6" y2="4"></line>
              <line x1="10" y1="2" x2="10" y2="4"></line>
              <line x1="14" y1="2" x2="14" y2="4"></line>
            </svg>
          </div>
        </div>
        <div class="cm-preloader__badge menu-view-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#e6923c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6l2.1-2.1"></path>
          </svg>
          <span>Contactless Dining &bull; Digital QR Menu</span>
        </div>
        <h1 class="cm-preloader__name" id="cafeName">Abol Cafe &amp; Roasters</h1>
        <p class="cm-preloader__tagline" id="initialTagline">Curating fresh flavors with authentic passion</p>
        <div class="cm-preloader__progress-stage">
          <div class="cm-preloader__bar">
            <div class="cm-preloader__bar-fill" style="width: 55%; background: linear-gradient(90deg, #e6923c, #f59e0b);"></div>
          </div>
          <span class="cm-preloader__status-text">Preparing your dining experience...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      try {
        var p = window.location.pathname.replace(/^\/+|\/+$/g, '');
        var el = document.getElementById('cafeName') || document.getElementById('initialCafeName');
        if (el) {
          if (p.includes('bento')) el.textContent = 'Bento Modern';
          else if (p.includes('editorial')) el.textContent = 'The Reserve';
          else if (p.includes('rustic') || p.includes('sunset')) el.textContent = 'Sunset Bistro & Grill';
          else if (p.includes('boutique') || p.includes('patisserie')) el.textContent = 'Artisan Pâtisserie';
          else if (p.includes('noir') || p.includes('skyline')) el.textContent = 'Skyline Lounge';
          else if (p.includes('abol')) el.textContent = 'Abol Cafe & Roasters';
          else if (p && p !== 'cafe' && p !== 'menu') {
            el.textContent = p.split('-').map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
          }
        }
      } catch (e) {}
    })();
  </script>

  <script type="module" src="/dist/menu.js"></script>
</body>
</html>
