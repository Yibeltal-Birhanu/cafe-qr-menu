<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14100e" />
  <meta name="description" content="Browse our animated digital menu - burgers, pizza, coffee, desserts and more." />
  <title>Loading menu&hellip;</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9749;</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/">
        <span class="brand__logo" id="cafeLogo">&#9749;</span>
        <span class="brand__text">
          <span class="brand__name" id="cafeName">Cafe</span>
          <span class="brand__tag" id="cafeTagline">Digital menu</span>
        </span>
      </a>

      <label class="search">
        <span class="search__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
          </svg>
        </span>
        <input id="search" type="search" placeholder="Search the menu&hellip;" autocomplete="off" aria-label="Search the menu" />
      </label>

      <a class="icon-btn" href="/admin" title="Admin dashboard" aria-label="Admin dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 17 4.7l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <div class="hero__inner">
        <div>
          <span class="eyebrow">&#9679; Scanned menu</span>
          <h1 id="heroTitle">Welcome to our cafe</h1>
          <p id="heroText">Freshly brewed, freshly grilled - explore every category below.</p>
          <div class="hero__stats">
            <div class="hero__stat"><b id="statCategories">0</b><span>Categories</span></div>
            <div class="hero__stat"><b id="statItems">0</b><span>Items</span></div>
            <div class="hero__stat"><b id="statCurrency">&ndash;</b><span>Currency</span></div>
          </div>
        </div>
        <div class="hero__art" id="heroArt" aria-hidden="true"></div>
      </div>
    </section>

    <nav class="chips" aria-label="Menu categories">
      <div class="wrap chips__row" id="chips"></div>
    </nav>

    <section class="board wrap">
      <div class="grid" id="grid"></div>
      <div id="emptyState" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <div>
        <strong id="footerCafe">Cafe</strong><br />
        <span id="footerNote">Scan, browse, enjoy.</span>
      </div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">
        <button class="btn" id="openQr" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 20h2v1h-2z" />
          </svg>
          Show table QR
        </button>
        <a class="btn" href="/admin">Manage menu</a>
      </div>
    </div>
  </footer>

  <div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="modal__box">
      <h2 id="qrTitle">Table QR code</h2>
      <p id="qrUrl"></p>
      <img id="qrImage" alt="QR code linking to this menu" />
      <button class="btn" id="closeQr" type="button" style="margin-top:1rem">Close</button>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
