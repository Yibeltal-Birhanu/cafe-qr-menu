<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <title>CafeMenu Super Admin &mdash; Platform Console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/superadmin.css" />
</head>
<body>
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #64748b;">
      <div style="text-align: center;">
        <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: saSpin 0.8s linear infinite; margin: 0 auto 14px;"></div>
        <div style="font-weight: 700; font-size: 0.95rem; color: #0f172a; letter-spacing: -0.01em;">Loading Platform Console...</div>
        <div style="font-size: 0.78rem; color: #64748b; margin-top: 4px;">Multi-Tenant MySQL Engine</div>
      </div>
    </div>
  </div>

  <style>
    @keyframes saSpin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="module" src="/dist/superadmin.js"></script>
</body>
</html>
